[project]
name = "end-imdb"
version = "0.1.0"
description = "Reproducible IMDB sentiment experiments on Apple Silicon"
requires-python = ">=3.12,<3.13"
dependencies = ["huggingface-hub>=0.30,<2", "tokenizers>=0.21,<1", "numpy>=2,<3"]

[project.optional-dependencies]
metal = ["mlx>=0.31,<0.33; sys_platform == 'darwin' and platform_machine == 'arm64'"]
reference = ["torch>=2.6,<3", "transformers>=4.48,<5", "safetensors>=0.5,<1"]
laya = [
    "laya==0.4.1",
]
analysis = [
    "matplotlib>=3.10,<4",
]
laya-mlx = [
    "laya-mlx==0.3.0",
]

[tool.uv]
package = false
