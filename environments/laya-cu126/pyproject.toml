[project]
name = "end-imdb-laya-cu126"
version = "0.1.0"
description = "Isolated Linux CUDA 12.6 runtime for the paired Laya head experiment"
requires-python = ">=3.12,<3.13"
dependencies = [
    "laya==0.4.1",
    "torch==2.14.1+cu126",
    "transformers==4.57.6",
    "numpy==2.5.3",
    "safetensors==0.8.0",
    "tokenizers==0.22.2",
    "huggingface-hub==0.36.2",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
constraint-dependencies = ["filelock==4.0.12"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
